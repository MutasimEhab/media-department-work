services:
  - type: web
    name: media-department-work-preview
    runtime: node
    plan: free
    branch: codex/neon-node-backend
    buildCommand: npm ci && npm --prefix backend ci && npm run build && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
